<!DOCTYPE html><html lang="es" class="dark"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Bridge Lite — Menú System Tray</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'electric-blue': '#3B82F6',
        'on-electric-blue': '#001A42',
        'electric-blue-soft': '#16243D',
        'on-electric-blue-soft': '#ADC6FF',
        'electric-blue-border': '#2573E6',
        'led-green': '#22C55E',
        'amber-pause': '#F59E0B',
        'on-amber-pause': '#2A1700',
        'amber-pause-soft': '#2A1F0A',
        'on-amber-pause-soft': '#FFB95F',
        'red-disconnect': '#FF8982',
        'red-disconnect-border': '#7F2929',
        'red-disconnect-soft': '#241414',
        'oled-black': '#000000',
        'oled-surface': '#0A0A0A',
        'oled-outline': '#1F1F1F',
        'oled-dim': '#787776',
        'dark-surface': '#121212',
        'dark-on-surface': '#F3F0EF',
        'dark-on-surface-muted': '#ADABAA',
        'dark-surface-card': '#1E1E1E',
        'dark-on-surface-card': '#F3F0EF',
        'dark-surface-elevated': '#262626',
        'dark-on-surface-elevated': '#E5E2E1',
        'dark-outline': '#313030',
        'dark-outline-variant': '#474646',
      },
      borderRadius: {
        'sm': '8px',
        'DEFAULT': '12px',
        'md': '16px',
        'lg': '20px',
        'xl': '24px',
        'full': '9999px',
      },
      spacing: {
        'gutter-xs': '4px',
        'gutter-sm': '8px',
        'gutter-md': '12px',
        'gutter-lg': '16px',
        'gutter-xl': '24px',
        'section': '32px',
        'page-margin': '20px',
      },
      fontFamily: {
        'headline': ['"Wix Madefor Display"', 'sans-serif'],
        'title': ['"Instrument Sans"', 'sans-serif'],
        'body': ['"Instrument Sans"', 'sans-serif'],
        'label': ['"Instrument Sans"', 'sans-serif'],
        'mono': ['"Spline Sans Mono"', 'monospace'],
      },
      fontSize: {
        'headline-lg': ['24px', { lineHeight: '32px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.15px', fontWeight: '600' }],
        'title-lg': ['18px', { lineHeight: '24px', letterSpacing: '0px', fontWeight: '600' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '600' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '400' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '500' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.2px', fontWeight: '500' }],
        'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0.3px', fontWeight: '400' }],
      },
      transitionDuration: {
        'state-change': '150ms',
        'surface-enter': '250ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'cubic-bezier(0.2, 0, 0, 1)',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
      },
    },
  },
};
if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Spline+Sans+Mono:wght@400;500&amp;family=Wix+Madefor+Display:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
  </style>
</head>
<body class="text-dark-on-surface antialiased selection:bg-electric-blue-soft selection:text-on-electric-blue-soft inline-block">

  <!-- Contenedor natural: Menú contextual de clic derecho + barra System Tray -->
  <div class="w-[340px] flex flex-col items-end gap-2 select-none">

    <!-- Menú contextual de clic derecho (System Tray) -->
    <div id="tray-context-menu" role="menu" aria-label="Menú contextual de NFC Bridge Lite" class="w-[300px] bg-dark-surface-card border border-dark-outline rounded-md p-1.5 shadow-2xl flex flex-col gap-0.5">
      <!-- Cabecera de estado del servicio -->
      <div class="px-gutter-md py-gutter-sm flex items-center justify-between gap-gutter-sm">
        <div class="flex items-center gap-gutter-sm min-w-0">
          <div class="w-7 h-7 rounded-sm bg-electric-blue-soft border border-electric-blue-border flex items-center justify-center shrink-0" aria-hidden="true">
            <span class="material-symbols-outlined text-electric-blue text-title-md">contactless</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-headline text-label-lg text-dark-on-surface font-semibold truncate">NFC Bridge Lite</span>
            <div class="flex items-center gap-1.5">
              <span id="tray-status-led" class="w-1.5 h-1.5 rounded-full bg-led-green shrink-0"></span>
              <span id="tray-status-text" class="font-label text-[11px] text-dark-on-surface-muted truncate tabular-nums">Pixel 8 Pro • TCP 4 ms</span>
            </div>
          </div>
        </div>
        <span class="font-mono text-[10px] text-dark-on-surface-muted bg-dark-surface-elevated border border-dark-outline px-1.5 py-0.5 rounded-sm shrink-0">PC</span>
      </div>

      <div class="h-px bg-dark-outline my-1" role="separator"></div>

      <!-- Acción principal: Abrir ventana -->
      <button type="button" role="menuitem" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="flex items-center gap-gutter-sm min-w-0">
          <span class="material-symbols-outlined text-title-md text-electric-blue shrink-0" aria-hidden="true">open_in_new</span>
          <span class="font-label text-label-md text-dark-on-surface font-semibold">Abrir ventana principal</span>
        </span>
      </button>

      <!-- Selector rápido de dispositivo móvil -->
      <div class="flex flex-col">
        <button id="btn-toggle-devices" type="button" role="menuitem" aria-expanded="true" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
          <span class="flex items-center gap-gutter-sm min-w-0">
            <span class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">smartphone</span>
            <span class="font-label text-label-md text-dark-on-surface">Cambiar dispositivo móvil</span>
          </span>
          <span id="devices-chevron" class="material-symbols-outlined text-title-md text-dark-on-surface-muted transition-transform duration-state-change" aria-hidden="true">expand_more</span>
        </button>

        <!-- Sublista inline de dispositivos -->
        <div id="tray-devices-submenu" class="pl-7 pr-1 py-0.5 flex flex-col gap-0.5">
          <button type="button" data-tray-device="Pixel 8 Pro" data-tray-meta="Pixel 8 Pro • TCP 4 ms" class="tray-device-option w-full px-gutter-sm py-1.5 rounded-sm flex items-center justify-between text-left bg-dark-surface-elevated/70 hover:bg-dark-surface-elevated transition-colors duration-state-change">
            <span class="font-label text-[12px] text-dark-on-surface">Pixel 8 Pro</span>
            <span class="material-symbols-outlined text-body-md text-led-green tray-check" aria-hidden="true">check</span>
          </button>
          <button type="button" data-tray-device="Galaxy S24" data-tray-meta="Galaxy S24 • TCP 6 ms" class="tray-device-option w-full px-gutter-sm py-1.5 rounded-sm flex items-center justify-between text-left hover:bg-dark-surface-elevated transition-colors duration-state-change">
            <span class="font-label text-[12px] text-dark-on-surface-muted">Galaxy S24</span>
            <span class="material-symbols-outlined text-body-md text-led-green tray-check hidden" aria-hidden="true">check</span>
          </button>
        </div>
      </div>

      <!-- Mostrar código QR único -->
      <button type="button" role="menuitem" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="flex items-center gap-gutter-sm min-w-0">
          <span class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">qr_code_2</span>
          <span class="font-label text-label-md text-dark-on-surface">Mostrar código QR de conexión</span>
        </span>
      </button>

      <div class="h-px bg-dark-outline my-1" role="separator"></div>

      <!-- Controles rápidos del lector -->
      <button id="btn-tray-pause" type="button" role="menuitemcheckbox" aria-checked="false" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="flex items-center gap-gutter-sm min-w-0">
          <span id="tray-pause-icon" class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">pause</span>
          <span id="tray-pause-label" class="font-label text-label-md text-dark-on-surface">Pausar lector NFC</span>
        </span>
      </button>

      <button id="btn-tray-usb" type="button" role="menuitemcheckbox" aria-checked="true" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="flex items-center gap-gutter-sm min-w-0">
          <span class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">usb</span>
          <span class="font-label text-label-md text-dark-on-surface">Prioridad Cable USB</span>
        </span>
        <span id="tray-usb-check" class="material-symbols-outlined text-title-md text-electric-blue shrink-0" aria-hidden="true">check</span>
      </button>

      <button id="btn-tray-autostart" type="button" role="menuitemcheckbox" aria-checked="true" class="w-full px-gutter-md py-2 rounded-sm flex items-center justify-between gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="flex items-center gap-gutter-sm min-w-0">
          <span class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">bolt</span>
          <span class="font-label text-label-md text-dark-on-surface">Iniciar con Windows</span>
        </span>
        <span id="tray-autostart-check" class="material-symbols-outlined text-title-md text-electric-blue shrink-0" aria-hidden="true">check</span>
      </button>

      <div class="h-px bg-dark-outline my-1" role="separator"></div>

      <!-- Configuración y salida -->
      <button type="button" role="menuitem" class="w-full px-gutter-md py-2 rounded-sm flex items-center gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-dark-surface-elevated focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0" aria-hidden="true">settings</span>
        <span class="font-label text-label-md text-dark-on-surface">Configuración</span>
      </button>

      <button id="btn-tray-disconnect" type="button" role="menuitem" class="w-full px-gutter-md py-2 rounded-sm flex items-center gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-red-disconnect-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-disconnect">
        <span class="material-symbols-outlined text-title-md text-red-disconnect shrink-0" aria-hidden="true">link_off</span>
        <span class="font-label text-label-md text-red-disconnect">Desconectar dispositivo</span>
      </button>

      <button type="button" role="menuitem" class="w-full px-gutter-md py-2 rounded-sm flex items-center gap-gutter-sm text-left transition-colors duration-state-change ease-state-change hover:bg-red-disconnect-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-disconnect">
        <span class="material-symbols-outlined text-title-md text-red-disconnect shrink-0" aria-hidden="true">power_settings_new</span>
        <span class="font-label text-label-md text-red-disconnect">Salir de NFC Bridge</span>
      </button>
    </div>

    <!-- Barra inferior simulando la esquina del System Tray de Windows -->
    <div class="w-full h-11 bg-dark-surface border border-dark-outline rounded-md px-gutter-md flex items-center justify-end gap-gutter-sm shadow-lg">
      <button type="button" title="Mostrar iconos ocultos" aria-label="Mostrar iconos ocultos" class="w-7 h-7 rounded-sm inline-flex items-center justify-center text-dark-on-surface-muted hover:bg-dark-surface-elevated transition-colors">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">keyboard_arrow_up</span>
      </button>

      <!-- Icono de NFC Bridge Lite en el System Tray (con clic derecho / toggle) -->
      <button id="tray-app-icon" type="button" title="NFC Bridge Lite — Clic derecho para opciones" aria-label="NFC Bridge Lite en bandeja del sistema" class="relative w-8 h-8 rounded-sm bg-electric-blue-soft border border-electric-blue-border inline-flex items-center justify-center text-electric-blue transition-colors hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-electric-blue">
        <span class="material-symbols-outlined text-title-lg" aria-hidden="true">contactless</span>
        <span id="tray-icon-badge" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-led-green border-2 border-dark-surface"></span>
      </button>

      <div class="flex items-center gap-2 text-dark-on-surface-muted px-1" aria-hidden="true">
        <span class="material-symbols-outlined text-title-md">wifi</span>
        <span class="material-symbols-outlined text-title-md">volume_up</span>
        <span class="material-symbols-outlined text-title-md">battery_full</span>
      </div>

      <div class="flex flex-col items-end leading-tight pl-1 font-label text-[11px] text-dark-on-surface tabular-nums">
        <span>16:54</span>
        <span class="text-dark-on-surface-muted">23/11/2026</span>
      </div>
    </div>

  </div>

  <script>
    (function () {
      const trayIcon = document.getElementById('tray-app-icon');
      const contextMenu = document.getElementById('tray-context-menu');
      const statusLed = document.getElementById('tray-status-led');
      const statusText = document.getElementById('tray-status-text');
      const iconBadge = document.getElementById('tray-icon-badge');

      if (trayIcon && contextMenu) {
        trayIcon.addEventListener('click', function () {
          contextMenu.classList.toggle('hidden');
        });
        trayIcon.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          contextMenu.classList.remove('hidden');
        });
      }

      const btnToggleDevices = document.getElementById('btn-toggle-devices');
      const devicesSubmenu = document.getElementById('tray-devices-submenu');
      const devicesChevron = document.getElementById('devices-chevron');
      if (btnToggleDevices && devicesSubmenu) {
        btnToggleDevices.addEventListener('click', function () {
          const isHidden = devicesSubmenu.classList.toggle('hidden');
          btnToggleDevices.setAttribute('aria-expanded', String(!isHidden));
          devicesChevron.textContent = isHidden ? 'chevron_right' : 'expand_more';
        });
      }

      document.querySelectorAll('.tray-device-option').forEach(function (opt) {
        opt.addEventListener('click', function () {
          document.querySelectorAll('.tray-device-option').forEach(function (o) {
            o.classList.remove('bg-dark-surface-elevated/70');
            o.querySelector('span:first-child').className = 'font-label text-[12px] text-dark-on-surface-muted';
            o.querySelector('.tray-check').classList.add('hidden');
          });
          opt.classList.add('bg-dark-surface-elevated/70');
          opt.querySelector('span:first-child').className = 'font-label text-[12px] text-dark-on-surface';
          opt.querySelector('.tray-check').classList.remove('hidden');
          statusLed.className = 'w-1.5 h-1.5 rounded-full bg-led-green shrink-0';
          iconBadge.className = 'absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-led-green border-2 border-dark-surface';
          statusText.textContent = opt.getAttribute('data-tray-meta');
        });
      });

      const btnPause = document.getElementById('btn-tray-pause');
      const pauseIcon = document.getElementById('tray-pause-icon');
      const pauseLabel = document.getElementById('tray-pause-label');
      let isPaused = false;
      if (btnPause) {
        btnPause.addEventListener('click', function () {
          isPaused = !isPaused;
          btnPause.setAttribute('aria-checked', String(isPaused));
          if (isPaused) {
            pauseIcon.textContent = 'play_arrow';
            pauseIcon.className = 'material-symbols-outlined text-title-md text-amber-pause shrink-0';
            pauseLabel.textContent = 'Reanudar lector NFC';
            statusLed.className = 'w-1.5 h-1.5 rounded-full bg-amber-pause shrink-0';
            iconBadge.className = 'absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-amber-pause border-2 border-dark-surface';
            statusText.textContent = 'Lector NFC en pausa';
          } else {
            pauseIcon.textContent = 'pause';
            pauseIcon.className = 'material-symbols-outlined text-title-md text-dark-on-surface-muted shrink-0';
            pauseLabel.textContent = 'Pausar lector NFC';
            statusLed.className = 'w-1.5 h-1.5 rounded-full bg-led-green shrink-0';
            iconBadge.className = 'absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-led-green border-2 border-dark-surface';
            statusText.textContent = 'Pixel 8 Pro • TCP 4 ms';
          }
        });
      }

      function bindCheckToggle(btnId, checkId) {
        const btn = document.getElementById(btnId);
        const check = document.getElementById(checkId);
        if (!btn || !check) return;
        btn.addEventListener('click', function () {
          const checked = btn.getAttribute('aria-checked') === 'true';
          btn.setAttribute('aria-checked', String(!checked));
          check.classList.toggle('hidden', checked);
        });
      }
      bindCheckToggle('btn-tray-usb', 'tray-usb-check');
      bindCheckToggle('btn-tray-autostart', 'tray-autostart-check');

      const btnDisconnect = document.getElementById('btn-tray-disconnect');
      if (btnDisconnect) {
        btnDisconnect.addEventListener('click', function () {
          statusLed.className = 'w-1.5 h-1.5 rounded-full bg-dark-on-surface-muted shrink-0';
          iconBadge.className = 'absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-dark-on-surface-muted border-2 border-dark-surface';
          statusText.textContent = 'Sin dispositivo conectado';
        });
      }
    })();
  </script>


</body></html>
