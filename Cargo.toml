[workspace]
members = [
    "crates/core-proto",
    "crates/nfc-bridge-sync",
    "crates/nfc-bridge-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
authors = ["Hector Zarate <HectorZaGa96@hotmail.com>"]
license = "MIT"
repository = "https://github.com/HectorZaGa/nfc-bridge-windows"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
bytes = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
core-proto = { path = "crates/core-proto" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

